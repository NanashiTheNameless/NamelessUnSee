name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Serialise runs per branch/PR: a newer push waits for the run in flight rather
# than racing it. cancel-in-progress is false because these runs build images and
# touch shared caches, so a half-finished run being killed is worse than waiting.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Enable Corepack and install pinned Yarn
        # Node 26 no longer bundles Corepack, so install it first.
        run: npm install -g --no-update-notifier --no-fund corepack@latest && corepack enable && corepack install

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Syntax check
        run: |
          find src moderation-worker -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run tests
        run: corepack yarn test
        env:
          # Tests use a throwaway data dir and disable external dataset fetches;
          # these keep CI hermetic and fast.
          TOR_LIST_ENABLED: 'false'
          VPN_LISTS_ENABLED: 'false'
